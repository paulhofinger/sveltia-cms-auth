allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
  workerd: false

auditConfig:
  ignoreGhsas:
    # braces, used only in Stylelint
    # https://github.com/advisories/GHSA-vfj7-8cjw-p6xm
    - GHSA-vfj7-8cjw-p6xm
    # minimatch < 11.0.1, used only by ESLint 10 (requires ^10, no fix possible yet).
    # Remove once ESLint moves to minimatch 11; the Dependabot alert stays open as a reminder.
    # https://github.com/advisories/GHSA-g3hv-75wg-m249
    - GHSA-g3hv-75wg-m249

engineStrict: true

minimumReleaseAge: 1440

# Work around https://github.com/sveltia/sveltia-cms-auth/issues/17
packages:
  - .

overrides:
  # https://github.com/advisories/GHSA-rgj7-g3m4-5g8c
  sharp@<0.35.4: ^0.35.4
